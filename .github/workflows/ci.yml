name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore HelveticOps.sln
      - name: Build
        run: dotnet build HelveticOps.sln --configuration Release --no-restore
      - name: Test with SQL Server integration coverage
        run: dotnet test HelveticOps.sln --configuration Release --no-build

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci${{ github.run_id }}x${{ github.run_attempt }}!Validation
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      ConnectionStrings__OperationsDb: Server=localhost,1433;Database=HelveticOpsCi;User Id=sa;Password=Ci${{ github.run_id }}x${{ github.run_attempt }}!Validation;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore EF tool and projects
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet restore HelveticOps.sln
      - name: Apply migrations to clean database
        run: dotnet ef database update --project src/HelveticOps.Infrastructure --startup-project src/HelveticOps.Api --context OperationsDbContext
      - name: Check migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/HelveticOps.Infrastructure --startup-project src/HelveticOps.Api --context OperationsDbContext
      - name: Generate idempotent migration SQL
        run: mkdir -p artifacts && dotnet ef migrations script --idempotent --project src/HelveticOps.Infrastructure --startup-project src/HelveticOps.Api --context OperationsDbContext --output artifacts/operations-migrations.sql
      - name: Upload migration SQL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-migration-sql
          path: artifacts/operations-migrations.sql
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Angular validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify generated API client
        run: npm run api:check

  containers:
    name: Production container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t helvetic-ops-api:${{ github.sha }} .
      - name: Build Web image
        run: docker build -t helvetic-ops-web:${{ github.sha }} web

  e2e-config:
    name: Authenticated E2E configuration
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_DISPATCHER_SESSION_STORAGE_JSON: ${{ secrets.E2E_DISPATCHER_SESSION_STORAGE_JSON }}
      E2E_MANAGER_SESSION_STORAGE_JSON: ${{ secrets.E2E_MANAGER_SESSION_STORAGE_JSON }}
      E2E_DETAIL_WORK_ORDER_ID: ${{ secrets.E2E_DETAIL_WORK_ORDER_ID }}
      E2E_EDIT_WORK_ORDER_ID: ${{ secrets.E2E_EDIT_WORK_ORDER_ID }}
      E2E_TRANSITION_WORK_ORDER_ID: ${{ secrets.E2E_TRANSITION_WORK_ORDER_ID }}
      E2E_CONFLICT_WORK_ORDER_ID: ${{ secrets.E2E_CONFLICT_WORK_ORDER_ID }}
      E2E_CREATE_REFERENCE: ${{ secrets.E2E_CREATE_REFERENCE }}
      E2E_CANCEL_WORK_ORDER_ID: ${{ secrets.E2E_CANCEL_WORK_ORDER_ID }}
    steps:
      - name: Check protected Entra E2E configuration
        id: check
        shell: bash
        run: |
          required=(E2E_BASE_URL E2E_DISPATCHER_SESSION_STORAGE_JSON E2E_MANAGER_SESSION_STORAGE_JSON E2E_DETAIL_WORK_ORDER_ID E2E_EDIT_WORK_ORDER_ID E2E_TRANSITION_WORK_ORDER_ID E2E_CONFLICT_WORK_ORDER_ID E2E_CREATE_REFERENCE E2E_CANCEL_WORK_ORDER_ID)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### Authenticated Playwright skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Required protected Entra E2E configuration is unavailable: ${missing[*]}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated Playwright configuration is available." >> "$GITHUB_STEP_SUMMARY"
          fi

  playwright:
    name: Authenticated Playwright
    needs: e2e-config
    if: needs.e2e-config.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      CI: true
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_DETAIL_WORK_ORDER_ID: ${{ secrets.E2E_DETAIL_WORK_ORDER_ID }}
      E2E_EDIT_WORK_ORDER_ID: ${{ secrets.E2E_EDIT_WORK_ORDER_ID }}
      E2E_TRANSITION_WORK_ORDER_ID: ${{ secrets.E2E_TRANSITION_WORK_ORDER_ID }}
      E2E_CONFLICT_WORK_ORDER_ID: ${{ secrets.E2E_CONFLICT_WORK_ORDER_ID }}
      E2E_CREATE_REFERENCE: ${{ secrets.E2E_CREATE_REFERENCE }}
      E2E_CANCEL_WORK_ORDER_ID: ${{ secrets.E2E_CANCEL_WORK_ORDER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Materialize protected session storage
        env:
          DISPATCHER_SESSION: ${{ secrets.E2E_DISPATCHER_SESSION_STORAGE_JSON }}
          MANAGER_SESSION: ${{ secrets.E2E_MANAGER_SESSION_STORAGE_JSON }}
        run: |
          dispatcher_path="$RUNNER_TEMP/dispatcher-session.json"
          manager_path="$RUNNER_TEMP/manager-session.json"
          printf '%s' "$DISPATCHER_SESSION" > "$dispatcher_path"
          printf '%s' "$MANAGER_SESSION" > "$manager_path"
          chmod 600 "$dispatcher_path" "$manager_path"
          echo "E2E_DISPATCHER_SESSION_STORAGE=$dispatcher_path" >> "$GITHUB_ENV"
          echo "E2E_MANAGER_SESSION_STORAGE=$manager_path" >> "$GITHUB_ENV"
      - name: Run authenticated Work Order E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artifacts
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
