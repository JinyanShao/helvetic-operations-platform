name: Deploy Production Container Apps

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Existing dedicated production Azure resource group.
        required: true
        default: rg-helvetic-ops-prod
      location:
        description: Azure region.
        required: true
        default: switzerlandnorth
      imageTag:
        description: Existing immutable commit SHA image tag to deploy. Leave empty to build and deploy this commit SHA.
        required: false
        default: ''
      deploymentMode:
        description: Deploy builds images and runs migrations. Rollback deploys an existing API/Web tag without migrations.
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      alertEmailReceivers:
        description: JSON array of alert receivers, for example [{"name":"ops","email":"ops@example.com"}].
        required: false
        default: '[]'

concurrency:
  group: deploy-container-apps-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy production Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      ENVIRONMENT_NAME: prod
      RESOURCE_GROUP: ${{ inputs.resourceGroup }}
      LOCATION: ${{ inputs.location }}
      ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
      ENTRA_SPA_CLIENT_ID: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
      ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
      SQL_ADMIN_PASSWORD: ${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}
      ALERT_EMAIL_RECEIVERS: ${{ inputs.alertEmailReceivers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve immutable image tag
        id: image
        shell: bash
        run: |
          image_tag="${{ inputs.imageTag }}"
          if [[ -z "$image_tag" ]]; then
            if [[ "${{ inputs.deploymentMode }}" == "rollback" ]]; then
              printf 'Rollback requires imageTag to name an existing immutable image.\n' >&2
              exit 1
            fi
            image_tag="$GITHUB_SHA"
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "mode=${{ inputs.deploymentMode }}" >> "$GITHUB_OUTPUT"

      - name: Validate required deployment inputs
        shell: bash
        run: |
          required=(ENTRA_TENANT_ID ENTRA_SPA_CLIENT_ID ENTRA_API_CLIENT_ID SQL_ADMIN_PASSWORD)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing production deployment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          node -e 'JSON.parse(process.env.ALERT_EMAIL_RECEIVERS)'

      - name: Check Azure deployment preconditions
        shell: bash
        run: |
          if ! az group show --name "$RESOURCE_GROUP" --query name -o tsv >/dev/null; then
            printf 'Production resource group %s does not exist. Confirm and create the dedicated production resource group before running this workflow.\n' "$RESOURCE_GROUP" >&2
            exit 1
          fi
          providers=(
            Microsoft.App
            Microsoft.Sql
            Microsoft.KeyVault
            Microsoft.ContainerRegistry
            Microsoft.Network
            Microsoft.OperationalInsights
            Microsoft.Insights
            Microsoft.ManagedIdentity
          )
          missing=()
          for provider in "${providers[@]}"; do
            state="$(az provider show --namespace "$provider" --query registrationState -o tsv)"
            if [[ "$state" != "Registered" ]]; then
              missing+=("${provider}:${state}")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Azure resource providers must be registered before production deployment: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Bootstrap infrastructure
        id: bootstrap
        shell: bash
        run: |
          deployment_name="hop-prod-${GITHUB_RUN_ID}-bootstrap"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              environmentName="$ENVIRONMENT_NAME" \
              location="$LOCATION" \
              imageTag="${{ steps.image.outputs.image_tag }}" \
              deploymentStage=bootstrap \
              entraTenantId="$ENTRA_TENANT_ID" \
              entraSpaClientId="$ENTRA_SPA_CLIENT_ID" \
              entraApiClientId="$ENTRA_API_CLIENT_ID" \
              sqlAdministratorPassword="$SQL_ADMIN_PASSWORD" \
              alertEmailReceivers="$ALERT_EMAIL_RECEIVERS"
          registry_name="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment_name" --query properties.outputs.containerRegistryName.value -o tsv)"
          echo "registry_name=$registry_name" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable images
        if: inputs.deploymentMode == 'deploy'
        shell: bash
        run: |
          registry_login_server="$(az acr show --name "${{ steps.bootstrap.outputs.registry_name }}" --query loginServer -o tsv)"
          az acr login --name "${{ steps.bootstrap.outputs.registry_name }}"
          docker build --file Dockerfile.api --tag "$registry_login_server/helvetic-ops-api:${{ steps.image.outputs.image_tag }}" .
          docker build --file Dockerfile.migrator --tag "$registry_login_server/helvetic-ops-migrator:${{ steps.image.outputs.image_tag }}" .
          docker build --tag "$registry_login_server/helvetic-ops-web:${{ steps.image.outputs.image_tag }}" ./web
          docker push "$registry_login_server/helvetic-ops-api:${{ steps.image.outputs.image_tag }}"
          docker push "$registry_login_server/helvetic-ops-migrator:${{ steps.image.outputs.image_tag }}"
          docker push "$registry_login_server/helvetic-ops-web:${{ steps.image.outputs.image_tag }}"

      - name: Deploy migrator job
        if: inputs.deploymentMode == 'deploy'
        id: migrator
        shell: bash
        run: |
          deployment_name="hop-prod-${GITHUB_RUN_ID}-migrator"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              environmentName="$ENVIRONMENT_NAME" \
              location="$LOCATION" \
              imageTag="${{ steps.image.outputs.image_tag }}" \
              deploymentStage=migrator \
              entraTenantId="$ENTRA_TENANT_ID" \
              entraSpaClientId="$ENTRA_SPA_CLIENT_ID" \
              entraApiClientId="$ENTRA_API_CLIENT_ID" \
              sqlAdministratorPassword="$SQL_ADMIN_PASSWORD" \
              alertEmailReceivers="$ALERT_EMAIL_RECEIVERS"
          echo "migrator_job=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment_name" --query properties.outputs.migratorJobName.value -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Run database migration job
        if: inputs.deploymentMode == 'deploy'
        shell: bash
        run: |
          execution_name="$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "${{ steps.migrator.outputs.migrator_job }}" --query name -o tsv)"
          for attempt in {1..60}; do
            status="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "${{ steps.migrator.outputs.migrator_job }}" --job-execution-name "$execution_name" --query properties.status -o tsv)"
            if [[ "$status" == "Succeeded" ]]; then
              exit 0
            fi
            if [[ "$status" == "Failed" || "$status" == "Canceled" ]]; then
              printf 'Migration job %s ended with status %s\n' "$execution_name" "$status" >&2
              exit 1
            fi
            sleep 10
          done
          printf 'Migration job %s did not finish within the timeout.\n' "$execution_name" >&2
          exit 1

      - name: Deploy API and Web revisions
        id: applications
        shell: bash
        run: |
          deployment_name="hop-prod-${GITHUB_RUN_ID}-applications"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              environmentName="$ENVIRONMENT_NAME" \
              location="$LOCATION" \
              imageTag="${{ steps.image.outputs.image_tag }}" \
              deploymentStage=applications \
              entraTenantId="$ENTRA_TENANT_ID" \
              entraSpaClientId="$ENTRA_SPA_CLIENT_ID" \
              entraApiClientId="$ENTRA_API_CLIENT_ID" \
              sqlAdministratorPassword="$SQL_ADMIN_PASSWORD" \
              alertEmailReceivers="$ALERT_EMAIL_RECEIVERS"
          echo "web_url=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment_name" --query properties.outputs.webUrl.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "api_app=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment_name" --query properties.outputs.apiContainerAppName.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "web_app=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment_name" --query properties.outputs.webContainerAppName.value -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Smoke check deployed revisions
        shell: bash
        run: |
          az containerapp show --resource-group "$RESOURCE_GROUP" --name "${{ steps.applications.outputs.api_app }}" --query properties.provisioningState -o tsv | grep -Fx Succeeded
          az containerapp show --resource-group "$RESOURCE_GROUP" --name "${{ steps.applications.outputs.web_app }}" --query properties.provisioningState -o tsv | grep -Fx Succeeded
          curl --fail --head "${{ steps.applications.outputs.web_url }}/"
          curl --fail "${{ steps.applications.outputs.web_url }}/api/ops/ready"
          {
            echo "### Production Container Apps deployment"
            echo "- Environment: production"
            echo "- Mode: ${{ steps.image.outputs.mode }}"
            echo "- Image tag: ${{ steps.image.outputs.image_tag }}"
            echo "- Web URL: ${{ steps.applications.outputs.web_url }}"
            echo "- Authenticated E2E remains scoped to the dedicated e2e environment, not production."
          } >> "$GITHUB_STEP_SUMMARY"
