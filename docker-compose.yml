services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OperationsDb: Server=sql,1433;Database=HelveticOps;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      WebOrigin: ${WEB_ORIGIN:-http://localhost:4200}
    ports: ["5080:8080"]
    depends_on:
      sql: { condition: service_healthy }
  web:
    build: ./web
    ports: ["4200:80"]
    depends_on: [api]
volumes:
  sql-data:
